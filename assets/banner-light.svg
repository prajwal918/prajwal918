<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f5f6fa"/>
      <stop offset="100%" stop-color="#eff1f5"/>
    </linearGradient>
    <linearGradient id="goldGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b08800"/>
      <stop offset="50%" stop-color="#996e00"/>
      <stop offset="100%" stop-color="#805600"/>
    </linearGradient>
    <linearGradient id="blueGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2959aa"/>
      <stop offset="50%" stop-color="#3d59a1"/>
      <stop offset="100%" stop-color="#8839ef"/>
    </linearGradient>
    <pattern id="gridLight" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#dce0e8" stroke-width="0.8" opacity="0.65"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGradLight)"/>
  <rect width="1200" height="340" rx="16" fill="url(#gridLight)"/>

  <!-- Border -->
  <rect x="1.5" y="1.5" width="1197" height="337" rx="15" fill="none" stroke="#ccd0da" stroke-width="1.5"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#blueGradLight)"/>

  <!-- Terminal Header Dots -->
  <g transform="translate(48, 42)">
    <circle cx="0" cy="0" r="6" fill="#e64553"/>
    <circle cx="20" cy="0" r="6" fill="#df8e1d"/>
    <circle cx="40" cy="0" r="6" fill="#40a02b"/>
    <text x="65" y="4" fill="#6c6f85" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="600">prajwal918 / flagship-profile-v2</text>
  </g>

  <!-- Title Badge -->
  <g transform="translate(48, 88)">
    <rect width="210" height="26" rx="6" fill="#e6e9ef" stroke="#bcc0cc" stroke-width="1"/>
    <text x="12" y="17" fill="url(#goldGradLight)" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.5">NMAMIT CSE • B.TECH</text>
  </g>

  <!-- Main Headline -->
  <text x="48" y="172" fill="#343b58" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" letter-spacing="-1">Prajwal Jogi</text>

  <!-- Subtitle -->
  <text x="48" y="214" fill="#2959aa" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="20" font-weight="600">Systems &amp; Full-Stack Engineering • Distributed Microservices</text>

  <!-- Description / Core Vectors -->
  <text x="48" y="254" fill="#5c5f77" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="400">
    Java 21 • Spring Boot 3.5 • C++20 POSIX • Linux AF_PACKET • R Statistical NLP • Web Audio DSP 60fps
  </text>

  <!-- Status Chip -->
  <g transform="translate(48, 282)">
    <circle cx="6" cy="6" r="4.5" fill="#385f0d"/>
    <text x="20" y="10" fill="#4c4f69" font-family="'JetBrains Mono', monospace" font-size="12">ENGINEERING CODES: OVO-VISUALIZER • DURDEN-CINEMA • PULSELEDGER</text>
  </g>

  <!-- Right Decorative Vinyl Silhouette -->
  <g transform="translate(1030, 170)" opacity="0.85">
    <!-- Vinyl Outer -->
    <circle cx="0" cy="0" r="115" fill="#e6e9ef" stroke="#b08800" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="95" fill="none" stroke="#ccd0da" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="75" fill="none" stroke="#bcc0cc" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="55" fill="none" stroke="#ccd0da" stroke-width="0.8"/>
    <!-- Gold Label -->
    <circle cx="0" cy="0" r="38" fill="url(#goldGradLight)"/>
    <circle cx="0" cy="0" r="8" fill="#eff1f5"/>
    <text x="0" y="3" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="800" text-anchor="middle">OVO SOUND</text>
  </g>
</svg>
