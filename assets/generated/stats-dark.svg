      <path d="M3 3h10v10H3z" stroke="#7aa2f7" stroke-width="1.8" fill="none"/>
      <text x="28" y="14" fill="#c0caf5" font-family="system-ui, sans-serif" font-size="13.5" font-weight="500">Repositories Contributed To:</text>
      <text x="360" y="14" fill="#bb9af7" font-family="'JetBrains Mono', monospace" font-size="13.5" font-weight="700" text-anchor="end">31</text>
