# .github/workflows/snake.yml
name: Generate Contribution Snake

on:
  schedule:
    - cron: "30 18 * * *" # 00:00 IST daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate TokyoNight Dark & Light Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-light.svg?color_snake=#2959aa&color_dots=#e6e7ed,#b4d1fc,#7aa2f7,#3d59a1,#2959aa
            dist/github-snake-dark.svg?color_snake=#bb9af7&color_dots=#1a1b26,#283457,#3d59a1,#7aa2f7,#7dcfff

      - name: Publish SVGs to isolated output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
